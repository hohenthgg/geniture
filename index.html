<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0f08">
<meta name="description" content="Officina Astrologica — genitura de Lucas · Pouso Alegre, 17/08/1994. Mandala natal, planetas nas casas segundo Olavo de Carvalho, estrelas fixas, aspectos e antiscia.">
<title>Officina Astrologica — Genitura</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23FF5C00'/%3E%3Ccircle cx='50' cy='50' r='12' fill='%231a0f08'/%3E%3C/svg%3E">
<style>
/* ============================================================
   OFFICINA ASTROLOGICA — claymorphism · laranja neon (#FF5C00)
   mobile-first · glifos reais · sem emojis · sem planetas modernos
   ============================================================ */
:root{
  --orange:#FF5C00;   --orange-soft:#FF8A3D;  --orange-lite:#FFB37A;  --peach:#FFD9BF;
  --fire:#FF6B1A;     --earth:#D6934E;        --air:#F2B279;          --water:#B06B41;
  --bg0:#140b06;      --bg1:#231409;          --bg2:#2d1a0d;
  --clay:#2b190d;     --clay-hi:#3a2413;      --clay-lo:#1c0f07;
  --ink:#F6E9DD;      --ink-dim:#CBA98E;      --ink-faint:#9c7a60;
  --line:#4a2e18;
  --shadow-dark:rgba(0,0,0,.55);
  --shadow-lite:rgba(255,140,60,.10);
  --r:26px; --r-sm:16px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); font-size:15px; line-height:1.6;
  background:radial-gradient(120% 80% at 50% -10%, #3a2010 0%, var(--bg1) 42%, var(--bg0) 100%) fixed;
  min-height:100vh;
}
.gl{font-family:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols2",var(--serif);font-weight:400}

.app{max-width:480px;margin:0 auto;
     padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}

/* ---------- cabeçalho ---------- */
.masthead{text-align:center;padding:16px 8px 8px}
.masthead .mark{
  width:64px;height:64px;margin:0 auto 12px;border-radius:50%;
  display:grid;place-items:center;font-size:30px;color:#fff;
  background:radial-gradient(circle at 34% 30%, var(--orange-lite), var(--orange) 55%, #c23e00);
  box-shadow:6px 8px 20px var(--shadow-dark), -4px -5px 14px var(--shadow-lite),
             inset 3px 3px 6px rgba(255,200,160,.5), inset -5px -6px 12px rgba(120,40,0,.55);
}
.masthead h1{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:.12em;
             margin:0;text-transform:uppercase;color:var(--ink)}
.masthead .who{font-family:var(--serif);font-style:italic;color:var(--orange-lite);font-size:16px;margin:3px 0 2px}
.masthead .born{color:var(--ink-dim);font-size:12px;letter-spacing:.06em}

.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.pill{font-size:11px;letter-spacing:.05em;color:var(--ink-dim);background:var(--clay);
      border-radius:999px;padding:6px 12px;
      box-shadow:inset 2px 2px 5px var(--clay-lo), inset -2px -2px 5px var(--clay-hi)}
.pill b{color:var(--orange-lite);font-weight:600}
.pill .gl{color:var(--orange-lite);font-size:13px}

/* ---------- abas ---------- */
.tabs{position:sticky;top:0;z-index:30;display:flex;gap:6px;padding:12px 0 10px;margin:8px 0 4px;
      background:linear-gradient(180deg, var(--bg1) 62%, rgba(35,20,9,0))}
.tab{flex:1;text-align:center;font-family:var(--sans);font-size:12.5px;font-weight:600;
     letter-spacing:.04em;color:var(--ink-dim);border:none;cursor:pointer;padding:12px 4px;
     border-radius:var(--r-sm);background:var(--clay);
     box-shadow:5px 5px 12px var(--shadow-dark), -4px -4px 10px var(--shadow-lite),
                inset 1px 1px 2px rgba(255,180,130,.10);
     transition:transform .12s ease, color .12s ease}
.tab .gl{display:block;font-size:17px;margin-bottom:3px;color:var(--ink-faint)}
.tab[aria-selected="true"]{color:#fff;
     background:linear-gradient(145deg, var(--orange-soft), var(--orange) 70%, #d24800);
     box-shadow:5px 6px 14px rgba(120,40,0,.5), -3px -3px 10px var(--shadow-lite),
                inset 2px 2px 4px rgba(255,210,180,.45), inset -3px -4px 8px rgba(150,50,0,.5)}
.tab[aria-selected="true"] .gl{color:#fff}
.tab:active{transform:translateY(1px)}

.subtabs{display:flex;gap:6px;margin:6px 0 16px;flex-wrap:wrap}
.subtab{flex:1 1 auto;min-width:92px;text-align:center;font-size:11.5px;font-weight:600;
        letter-spacing:.03em;color:var(--ink-dim);border:none;cursor:pointer;padding:9px 8px;
        border-radius:12px;background:var(--clay);
        box-shadow:inset 2px 2px 5px var(--clay-lo), inset -2px -2px 5px var(--clay-hi);
        transition:color .12s ease}
.subtab[aria-selected="true"]{color:#fff;background:linear-gradient(145deg,#7a3200,#a34200);
        box-shadow:inset 2px 2px 6px rgba(60,20,0,.6), inset -2px -2px 6px rgba(200,90,20,.35)}

/* ---------- clay card ---------- */
.card{background:linear-gradient(145deg, var(--clay-hi), var(--clay) 55%, var(--clay-lo));
      border-radius:var(--r);padding:20px 18px;margin:0 0 18px;
      box-shadow:9px 10px 24px var(--shadow-dark), -6px -6px 16px var(--shadow-lite),
                 inset 2px 2px 4px rgba(255,180,130,.10), inset -5px -6px 12px rgba(0,0,0,.34)}
.card.tight{padding:16px 16px}
.card-h{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.card-h .badge{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
      font-size:24px;color:#fff;
      background:radial-gradient(circle at 35% 30%, var(--orange-lite), var(--orange) 58%, #bd3c00);
      box-shadow:4px 5px 12px var(--shadow-dark), inset 2px 2px 4px rgba(255,210,175,.5),
                 inset -3px -4px 8px rgba(130,45,0,.5)}
.card-h .t{flex:1;min-width:0}
.card-h .t h3{margin:0;font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.01em;line-height:1.2}
.card-h .t .sub{color:var(--orange-lite);font-size:12.5px;font-style:italic;font-family:var(--serif);margin-top:2px}
.pos{display:inline-block;font-size:12px;color:var(--ink-dim);letter-spacing:.03em;
     background:var(--clay-lo);border-radius:999px;padding:4px 11px;margin:0 0 12px;
     box-shadow:inset 1px 1px 3px #000, inset -1px -1px 2px var(--clay-hi)}
.pos .gl{color:var(--orange-lite)}
.card p{margin:0 0 11px}
.card p:last-child{margin-bottom:0}
.lead{color:var(--ink-dim);font-size:13.5px;font-style:italic;font-family:var(--serif);
      border-left:3px solid var(--orange);padding-left:12px;margin:0 0 14px}
.chave{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--clay-lo);
       box-shadow:inset 2px 2px 5px #000, inset -2px -2px 5px var(--clay-hi);font-size:13.5px}
.chave b{display:block;color:var(--orange-lite);font-size:10.5px;letter-spacing:.18em;
         text-transform:uppercase;margin-bottom:5px;font-weight:700}
.weave{margin-top:12px;font-size:13px;color:var(--peach)}
.weave .lab{color:var(--orange-lite);font-weight:600}
.src{margin-top:12px;font-size:10.5px;color:var(--ink-faint);letter-spacing:.05em;text-transform:uppercase}

/* ---------- regências ---------- */
.rege{margin:0 0 14px;padding:11px 13px;border-radius:14px;background:var(--clay-lo);
      box-shadow:inset 2px 2px 5px #000, inset -2px -2px 5px var(--clay-hi)}
.rege>b{display:block;color:var(--orange-lite);font-size:10.5px;letter-spacing:.14em;
        text-transform:uppercase;margin-bottom:8px;font-weight:700}
.reg-item{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;margin-top:7px}
.reg-casa{flex:none;background:linear-gradient(145deg,var(--orange-soft),var(--orange) 70%,#cf4600);
          color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:9px;
          box-shadow:2px 3px 6px rgba(0,0,0,.45), inset 1px 1px 2px rgba(255,210,180,.4)}
.reg-txt{color:var(--ink-dim);line-height:1.42}
.reg-signo{display:block;color:var(--peach);font-size:11px}

/* ---------- gráficos ---------- */
.chart{margin-top:4px}
.bar-row{margin:0 0 13px}
.bar-row:last-child{margin-bottom:0}
.bar-top{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.bar-name{flex:1;font-size:12.5px;color:var(--ink);line-height:1.3}
.bar-name .gl{color:var(--orange-lite);font-size:14px;margin-right:4px}
.bar-val{font-size:11.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums;font-weight:700}
.bar-track{height:13px;border-radius:7px;background:#1a0e06;
           box-shadow:inset 2px 2px 5px #000, inset -1px -1px 3px var(--clay-hi)}
.bar-fill{height:100%;border-radius:7px;box-shadow:inset 1px 1px 2px rgba(255,255,255,.28),
          2px 2px 6px rgba(0,0,0,.4)}
.bar-why{font-size:11px;color:var(--ink-faint);margin-top:5px;line-height:1.45}
.chart-legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:14px;font-size:11px;color:var(--ink-dim)}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.nota{margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(255,92,0,.09);
      border-left:3px solid var(--orange);font-size:11.5px;color:var(--peach);line-height:1.45}

/* ---------- mandala ---------- */
.mandala-wrap{padding:8px 6px;background:#07070C;border-radius:20px;
  box-shadow:inset 3px 3px 10px #000, inset -2px -2px 8px rgba(255,140,60,.07)}
svg.mandala{width:100%;height:auto;display:block;overflow:visible}
.mandala text{font-family:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols2",var(--serif)}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--ink-dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:4px}
.chip{display:flex;align-items:center;gap:9px;background:var(--clay);border-radius:14px;padding:9px 11px;
      box-shadow:inset 2px 2px 5px var(--clay-lo), inset -2px -2px 5px var(--clay-hi)}
.chip .g{font-size:19px;color:var(--orange-lite);width:22px;text-align:center}
.chip .n{font-size:11px;color:var(--ink-dim);line-height:1.25}
.chip .n b{display:block;color:var(--ink);font-size:12.5px;font-weight:600}
.chip .h{margin-left:auto;font-size:10px;color:var(--ink-faint);text-align:right;white-space:nowrap}

.sect-title{font-family:var(--serif);font-size:15px;color:var(--orange-lite);letter-spacing:.05em;
            margin:2px 0 10px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--ink-faint);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
td .gl{color:var(--orange-lite);font-size:15px}
tr:last-child td{border-bottom:none}
.rx{color:var(--orange);font-weight:700;font-size:11px}

.asp-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.asp-row:last-child{border-bottom:none}
.asp-glyphs{font-size:16px;color:var(--ink);white-space:nowrap;letter-spacing:2px}
.asp-glyphs .op{color:var(--orange)}
.asp-body{flex:1;min-width:0}
.asp-body .nm{display:block;font-size:13.5px;font-weight:600}
.asp-body .ds{display:block;font-size:11.5px;color:var(--ink-dim);margin-top:1px}
.asp-orb{font-size:11px;color:var(--ink-faint);text-align:right;white-space:nowrap}
.asp-orb .ap{color:var(--orange-lite);font-weight:700}

.btn{display:block;width:100%;font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.08em;
     text-transform:uppercase;color:#fff;border:none;cursor:pointer;padding:15px;border-radius:var(--r-sm);
     background:linear-gradient(145deg, var(--orange-soft), var(--orange) 70%, #cf4600);
     box-shadow:6px 7px 16px rgba(120,40,0,.5), -4px -4px 10px var(--shadow-lite),
                inset 2px 2px 4px rgba(255,210,180,.4), inset -3px -4px 8px rgba(150,50,0,.5)}
.btn:active{transform:translateY(1px)}

.foot{text-align:center;color:var(--ink-faint);font-size:11px;font-style:italic;
      font-family:var(--serif);padding:20px 10px 8px}
.hidden{display:none!important}

@media print{
  body{background:#fff;color:#000}
  .tabs,.subtabs,.btn,.foot,.masthead .mark{display:none!important}
  .view{display:block!important}
  .card{box-shadow:none;border:1px solid #ccc;background:#fff;color:#000;border-radius:8px;page-break-inside:avoid}
  .card-h .badge,.pill{box-shadow:none}
}
</style>
</head>
<body>
<div class="app">

  <header class="masthead">
    <div class="mark gl">&#9737;&#65038;</div>
    <h1>Officina Astrologica</h1>
    <div class="who">Genitura de Lucas</div>
    <div class="born">Pouso Alegre, Minas Gerais &middot; 17 de agosto de 1994 &middot; 06h00</div>
    <div class="pills" id="pills"></div>
  </header>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <section class="view" id="view-mandala">
    <div class="card">
      <div class="mandala-wrap" id="mandala"></div>
      <div class="legend">
        <span><i style="background:#E2593F"></i>aspecto duro</span>
        <span><i style="background:#4A8FD6"></i>aspecto brando</span>
        <span><i style="background:#C9A227"></i>estrela fixa</span>
      </div>
    </div>
    <div class="card tight">
      <div class="sect-title">Pontos da genitura</div>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <section class="view hidden" id="view-natal">
    <nav class="subtabs" role="tablist" id="subtabs"></nav>
    <div id="sub-casas"></div>
    <div id="sub-estrelas" class="hidden"></div>
    <div id="sub-aspectos" class="hidden"></div>
    <div id="sub-saude" class="hidden"></div>
  </section>

  <section class="view hidden" id="view-dados">
    <div class="card tight"><div class="sect-title">Posi&ccedil;&otilde;es planet&aacute;rias</div><table id="tblPos"></table></div>
    <div class="card tight"><div class="sect-title">C&uacute;spides das casas</div><table id="tblCusp"></table></div>
    <div class="card tight"><div class="sect-title">Seita &amp; sortes</div><table id="tblSect"></table></div>
    <button class="btn" id="btnPrint">Exportar / Imprimir a genitura</button>
  </section>

  <div class="foot">Nada al&eacute;m dos sete: Sol, Lua, Merc&uacute;rio, V&ecirc;nus, Marte, J&uacute;piter e Saturno.</div>
</div>

<script src="./assets/genitura.js"></script>
</body>
</html>
